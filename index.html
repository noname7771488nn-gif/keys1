<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Key System (Anti-Bypass)</title>
    <style>
        body {
            background-color: #1e1e24;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #2a2a30;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h2 { margin-top: 0; color: #0078d7; }
        p { color: #b4b4b9; font-size: 14px; }
        input {
            width: 90%;
            padding: 12px;
            margin: 15px 0;
            border: none;
            border-radius: 6px;
            background-color: #3d3d44;
            color: white;
            font-size: 16px;
            text-align: center;
        }
        button {
            background-color: #2e8b57;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 96%;
            transition: background 0.2s;
        }
        button:hover { background-color: #3cb371; }
        button:disabled {
            background-color: #555 !important;
            cursor: not-allowed;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #1e1e24;
            border-radius: 6px;
            display: none;
            border: 1px solid #0078d7;
        }
        .key-text {
            font-size: 20px;
            font-weight: bold;
            color: #00ff7f;
            letter-spacing: 1px;
        }
        .error-msg {
            color: #ff4d4d;
            font-weight: bold;
            margin: 15px 0;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🔑 Отримати Ключ Доступу</h2>
    <div id="errorBox" class="error-msg">❌ Ви обійшли рекламу або посилання застаріло! Пройдіть Linkvertise чесно.</div>
    
    <p id="instructionText">Введіть ваш Roblox UserId для генерації ключа.</p>
    
    <input type="number" id="userIdInput" placeholder="Введіть ваш Roblox ID...">
    <button id="genBtn" onclick="generateKey()">Згенерувати Ключ</button>

    <div class="result-box" id="resultBox">
        <p>Ваш індивідуальний ключ на 24 години:</p>
        <div class="key-text" id="keyOutput">KEY-00000000</div>
    </div>
</div>

<script>
// Перевірка Linkvertise Anti-Bypass при завантаженні сторінки
const urlParams = new URLSearchParams(window.location.search);
const hasPassedLinkvertise = urlParams.has('hash'); // Шукаємо ?hash= від Linkvertise

if (!hasPassedLinkvertise) {
    // Якщо зайшли без проходження реклами (пряме посилання або байпас)
    document.getElementById('genBtn').disabled = true;
    document.getElementById('userIdInput').disabled = true;
    document.getElementById('errorBox').style.display = 'block';
    document.getElementById('instructionText').style.textDecoration = 'line-through';
}

function generateKey() {
    const userId = document.getElementById('userIdInput').value.trim();
    if (!userId) {
        alert('Будь ласка, введіть ваш Roblox UserId!');
        return;
    }

    const SECRET_SALT = "MySuperSecretSalt123!";
    const currentDay = math.floor(Date.now() / 1000 / 86400);
    const rawString = userId + "_" + currentDay + "_" + SECRET_SALT;
    
    let hash = 0;
    for (let i = 0; i < rawString.length; i++) {
        hash = (hash * 31 + rawString.charCodeAt(i)) % 100000000;
    }
    
    document.getElementById('keyOutput').innerText = "KEY-" + hash;
    document.getElementById('resultBox').style.display = 'block';
}
</script>

</body>
</html>
