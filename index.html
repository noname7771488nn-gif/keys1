<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Key System (Anti-Bypass)</title>
    <style>
        body {
            background-color: #1e1e24;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #2a2a30;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h2 { margin-top: 0; color: #0078d7; }
        p { color: #b4b4b9; font-size: 14px; }
        input {
            width: 90%;
            padding: 12px;
            margin: 15px 0;
            border: none;
            border-radius: 6px;
            background-color: #3d3d44;
            color: white;
            font-size: 16px;
            text-align: center;
        }
        button {
            background-color: #2e8b57;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 96%;
            transition: background 0.2s;
        }
        button:hover { background-color: #3cb371; }
        button:disabled {
            background-color: #555 !important;
            cursor: not-allowed;
        }
        .bypass-btn {
            background-color: #8b2e2e;
            margin-top: 10px;
        }
        .bypass-btn:hover { background-color: #b33c3c; }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #1e1e24;
            border-radius: 6px;
            display: none;
            border: 1px solid #0078d7;
        }
        .key-text {
            font-size: 20px;
            font-weight: bold;
            color: #00ff7f;
            letter-spacing: 1px;
            user-select: all;
        }
        .error-msg {
            color: #ff4d4d;
            font-weight: bold;
            margin: 15px 0;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🔑 Get Your Access Key</h2>
    <div id="errorBox" class="error-msg">❌ Security check failed! Please pass the Linkvertise link honestly.</div>
    
    <p id="instructionText">Enter your Roblox UserId (found inside the script GUI) to generate today's key.</p>
    
    <input type="number" id="userIdInput" placeholder="Enter your Roblox ID here...">
    <button id="genBtn" onclick="generateKey()">Generate Key</button>
    <button id="bypassBtn" class="bypass-btn" onclick="forceUnlock()" style="display: none;">I passed Linkvertise (Unlock)</button>

    <div class="result-box" id="resultBox">
        <p>Your unique key for the next 24 hours:</p>
        <div class="key-text" id="keyOutput">KEY-00000000</div>
        <p style="font-size: 11px; margin-top: 10px; color: #888;">Click on the key to copy it</p>
    </div>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const hasPassedLinkvertise = urlParams.has('hash'); 

if (!hasPassedLinkvertise) {
    document.getElementById('genBtn').disabled = true;
    document.getElementById('userIdInput').disabled = true;
    document.getElementById('errorBox').style.display = 'block';
    document.getElementById('instructionText').style.textDecoration = 'line-through';
    document.getElementById('bypassBtn').style.display = 'block'; 
}

function forceUnlock() {
    document.getElementById('genBtn').disabled = false;
    document.getElementById('userIdInput').disabled = false;
    document.getElementById('errorBox').style.display = 'none';
    document.getElementById('instructionText').style.textDecoration = 'none';
    document.getElementById('bypassBtn').style.display = 'none';
}

function generateKey() {
    const userId = document.getElementById('userIdInput').value.trim();
    if (!userId) {
        alert('Please enter your valid Roblox UserId!');
        return;
    }

    const SECRET_SALT = "MySuperSecretSalt123!";
    const currentDay = Math.floor(Date.now() / 1000 / 86400); 
    const rawString = userId + "_" + currentDay + "_" + SECRET_SALT;
    
    let hash = 0;
    for (let i = 0; i < rawString.length; i++) {
        hash = (hash * 31 + rawString.charCodeAt(i)) % 100000000;
    }
    
    document.getElementById('keyOutput').innerText = "KEY-" + hash;
    document.getElementById('resultBox').style.display = 'block';
}
</script>

</body>
</html>
