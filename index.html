<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kukirin Hub — Secure Activation</title>
    <style>
        :root {
            --bg-main: #0b0b0e;
            --bg-card: #13131a;
            --accent: #0084ff;
            --accent-glow: rgba(0, 132, 255, 0.4);
            --success: #00ff87;
            --text-main: #ffffff;
            --text-sub: #868694;
        }
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        /* Background Animated Glow */
        body::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: var(--accent);
            border-radius: 50%;
            filter: blur(150px);
            opacity: 0.15;
            z-index: -1;
            animation: floatGlow 8s infinite alternate;
        }
        @keyframes floatGlow {
            0% { transform: translate(-50px, -50px); }
            100% { transform: translate(50px, 50px); }
        }
        .container {
            background-color: var(--bg-card);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
            text-align: center;
            max-width: 420px;
            width: 100%;
            position: relative;
        }
        .container::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }
        h2 { margin: 0 0 10px 0; font-size: 26px; font-weight: 800; letter-spacing: 0.5px; }
        p { color: var(--text-sub); font-size: 14px; line-height: 1.5; margin-bottom: 25px; }
        .status-msg {
            font-weight: 700;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .text-info { color: var(--accent); }
        .error { color: #ff4d4d; border-color: rgba(255, 77, 77, 0.2); background: rgba(255, 77, 77, 0.05); }
        .success { color: var(--success); border-color: rgba(0, 255, 135, 0.2); background: rgba(0, 255, 135, 0.05); }
        input {
            width: 100%;
            padding: 14px;
            margin: 15px 0;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            background-color: #1a1a24;
            color: white;
            font-size: 16px;
            text-align: center;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s;
        }
        input:focus { border-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }
        button {
            background: linear-gradient(135deg, var(--accent), #0052cc);
            color: white;
            border: none;
            padding: 15px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--accent-glow);
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px var(--accent-glow); opacity: 0.95; }
        button:active { transform: translateY(0); }
        .result-box {
            margin-top: 25px;
            padding: 20px;
            background-color: #0b0b0e;
            border-radius: 12px;
            display: none;
            border: 1px solid rgba(0, 255, 135, 0.3);
            position: relative;
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .key-text {
            font-size: 22px;
            font-weight: 800;
            color: var(--success);
            letter-spacing: 1.5px;
            padding: 10px;
            background: rgba(0, 255, 135, 0.05);
            border-radius: 6px;
            cursor: pointer;
            user-select: all;
            border: 1px dashed rgba(0, 255, 135, 0.2);
            transition: background 0.2s;
        }
        .key-text:hover { background: rgba(0, 255, 135, 0.1); }
    </style>
</head>
<body>

<div class="container">
    <h2>🔑 System Activation</h2>
    <div id="statusBox" class="status-msg text-info">Verifying secure Linkvertise token...</div>
    
    <p id="instructionText" style="display:none;">Enter your Roblox ID displayed inside the script loader interface to retrieve your unique access key.</p>
    
    <input type="number" id="userIdInput" placeholder="Enter Roblox UserId..." style="display:none;">
    <button id="genBtn" onclick="processGeneration()" style="display:none;">Generate Key</button>

    <div class="result-box" id="resultBox">
        <p style="margin-top:0; margin-bottom:10px;">Your 24-Hour Active Key:</p>
        <div class="key-text" id="keyOutput" onclick="navigator.clipboard.writeText(this.innerText); alert('Key copied to clipboard!')">KEY-00000000</div>
        <p style="font-size: 11px; margin-top: 10px; margin-bottom: 0; color: var(--text-sub);">This key will expire automatically in 24 hours.</p>
    </div>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const validationToken = urlParams.get('tk') || urlParams.get('hash'); 
const statusBox = document.getElementById('statusBox');

const LINKVERTISE_API_KEY = "25c946900dc877c68cebce3d1e255f61457ad31e952998159b3003ca986bc51b";
const SECRET_SALT = "MySuperSecretSalt123!";

function checkSavedKey() {
    const saved = localStorage.getItem('kuki_saved_session');
    if (saved) {
        const session = JSON.parse(saved);
        const currentDay = Math.floor(Date.now() / 1000 / 86400);
        
        // Якщо збережена доба збігається з поточною — миттєво віддаємо старий ключ
        if (session.day === currentDay) {
            statusBox.className = "status-msg success";
            statusBox.innerText = "✅ Welcome back! Active session found.";
            document.getElementById('keyOutput').innerText = session.key;
            document.getElementById('resultBox').style.display = 'block';
            return true;
        } else {
            localStorage.removeItem('kuki_saved_session'); // Скидаємо старий ключ через 24 години
        }
    }
    return false;
}

async function checkBypass() {
    if (checkSavedKey()) return;

    if (!validationToken) {
        statusBox.className = "status-msg error";
        statusBox.innerText = "❌ Protection Error: Please complete the Linkvertise checkpoint.";
        return;
    }

    try {
        const response = await fetch(`https://linkvertise.com{LINKVERTISE_API_KEY}&token=${validationToken}`);
        if (response.ok || (await response.json()).success) {
            unlockForm();
        } else {
            statusBox.className = "status-msg error";
            statusBox.innerText = "❌ Security Alert: Bypass framework detected.";
        }
    } catch (e) {
        // Резерв при CORS-блокуванні
        if (validationToken.length > 12) unlockForm();
        else {
            statusBox.className = "status-msg error";
            statusBox.innerText = "❌ Validation failed. Verification engine offline.";
        }
    }
}

function unlockForm() {
    statusBox.className = "status-msg success";
    statusBox.innerText = "✅ Verification cleared successfully!";
    document.getElementById('instructionText').style.display = 'block';
    document.getElementById('userIdInput').style.display = 'block';
    document.getElementById('genBtn').style.display = 'block';
}

function processGeneration() {
    const userId = document.getElementById('userIdInput').value.trim();
    if (!userId) return alert('Please input your Roblox UserId!');

    const currentDay = Math.floor(Date.now() / 1000 / 86400);
    const rawString = userId + "_" + currentDay + "_" + SECRET_SALT;
    
    let hash = 0;
    for (let i = 0; i < rawString.length; i++) {
        hash = (hash * 31 + rawString.charCodeAt(i)) % 100000000;
    }
    const generatedKey = "KEY-" + hash;

    // Зберігаємо ключ у браузері разом із номером дня
    localStorage.setItem('kuki_saved_session', JSON.stringify({
        key: generatedKey,
        day: currentDay
    }));

    document.getElementById('keyOutput').innerText = generatedKey;
    document.getElementById('resultBox').style.display = 'block';
}

checkBypass();
</script>

</body>
</html>
